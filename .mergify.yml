merge_queue:
  max_parallel_checks: 1

queue_rules:
  - name: default
    batch_size: 1
    checks_timeout: null
    merge_method: merge
    queue_conditions:
      - -draft
      - -label = hold
      - check-success=verify
      - check-success=live-gate
      - "#review-threads-unresolved = 0"
    merge_conditions: []

merge_protections_settings:
  auto_merge_conditions:
    - base = main
    - -files~=^\.github/

merge_protections:
  - name: Queue ready pull requests
    description: Automatically queue non-draft pull requests targeting main without a hold label after verify and live-gate pass on the head and every review thread is resolved.
    if:
      - base = main
    success_conditions:
      - -draft
      - -label = hold
      - check-success=verify
      - check-success=live-gate
      - "#review-threads-unresolved = 0"
  - name: Unfret on risky paths
    description: Pull requests that touch .github/ or the Mergify config also wait for Unfret.
    if:
      - base = main
      - files ~= ^(\.github/|\.mergify(\.ya?ml\Z|/))
    success_conditions:
      - check-success = @unfret-eal/Unfret

commands_restrictions:
  requeue:
    conditions:
      - sender-permission >= write
